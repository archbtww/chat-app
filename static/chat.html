<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="assets/main.css" />
    <title>Chat</title>
  </head>
  <body>
    <div id="chatScreen">
      <div id="leftOfChat">
        <div id="leftOfChatHeader">
          <span class="whiteText">Conversations</span>
        </div>
        <div id="conversations"></div>
        <div id="newChat">
          <button id="newChatButton"></button>
          <input id="newChatInput" placeholder="New chat" hidden />
        </div>
      </div>
      <div id="chatDiv">
        <div id="chatDivHeader">
          <span class="whiteText" id="currentChat"></span>
        </div>
        <div id="messages"></div>
        <div id="inputs">
          <input id="messageInput" placeholder="Message" />
          <button id="sendButton"></button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
